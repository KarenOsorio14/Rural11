<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crear cuenta · Rural 11</title>
  <meta name="theme-color" content="#17153B">
  <script src="/js/core/theme-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <button class="theme-toggle theme-toggle--floating" id="theme-toggle" type="button" aria-label="Cambiar tema"></button>

  <main class="auth">
    <section class="auth__brand">
      <a class="auth__logo" href="/bienvenida.html">
        <span class="auth__name">Rural 11</span>
      </a>
      <img class="auth__grano" src="/img/grano/grano-lupa.webp" alt="" width="965" height="820">
    </section>

    <section class="auth__panel">
      <form id="register-form" class="auth__form" novalidate>
        <h1 class="auth__title">Crear cuenta</h1>
        <p class="auth__lead">Crea tu cuenta y empieza tu ruta al ICFES.</p>

        <div class="field">
          <label class="field__label" for="firstName">Nombres</label>
          <div class="field__control">
            <input class="field__input" id="firstName" name="firstName" type="text"
                   autocomplete="given-name" aria-describedby="firstName-error" required>
          </div>
          <p class="field__error" id="firstName-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="lastName">Apellidos</label>
          <div class="field__control">
            <input class="field__input" id="lastName" name="lastName" type="text"
                   autocomplete="family-name" aria-describedby="lastName-error" required>
          </div>
          <p class="field__error" id="lastName-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="email">Correo electrónico</label>
          <div class="field__control">
            <input class="field__input" id="email" name="email" type="email"
                   autocomplete="username" inputmode="email" autocapitalize="none"
                   spellcheck="false" aria-describedby="email-error" required>
          </div>
          <p class="field__error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="documentNumber">Número de documento</label>
          <div class="field__control">
            <input class="field__input" id="documentNumber" name="documentNumber" type="text"
                   autocomplete="username" inputmode="numeric" autocapitalize="none"
                   spellcheck="false" aria-describedby="documentNumber-error" required>
          </div>
          <p class="field__error" id="documentNumber-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <div class="field__control">
            <input class="field__input" id="password" name="password" type="password"
                   autocomplete="new-password" aria-describedby="password-hint password-error" required>
            <button class="field__toggle" id="toggle-password" type="button"
                    aria-controls="password confirm" aria-pressed="false">Mostrar</button>
          </div>
          <p class="field__hint" id="password-hint">Entre 8 y 128 caracteres (recomendado: 12). Incluye mayúscula, minúscula, número y carácter especial.</p>
          <p class="field__error" id="password-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="confirm">Confirmar contraseña</label>
          <div class="field__control">
            <input class="field__input" id="confirm" name="confirm" type="password"
                   autocomplete="new-password" aria-describedby="confirm-error" required>
          </div>
          <p class="field__error" id="confirm-error" hidden></p>
        </div>

        <button class="btn btn--primary" id="submit" type="submit">Crear cuenta</button>

        <p class="auth-switch">¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a></p>
      </form>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
