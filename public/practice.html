<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Práctica de Ciencias Sociales · PWA</title>
  <meta name="theme-color" content="#17153B">
  <script src="/js/core/theme-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/questionnaires.css">
</head>

<body>
  <header class="topbar">
    <div class="topbar__left">
      <a href="/#practica" class="btn btn--ghost btn--sm btn--link">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> Volver
      </a>
      <span class="topbar__brand" id="topbar-topic-title">Ciencias Sociales</span>
    </div>
    <div class="topbar__actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <main class="home" id="practice-main" hidden>
    <!-- Encabezado del Tema Seleccionado -->
    <section class="user-profile" id="topic-header-card">
      <div class="user-profile__header">
        <div class="topic-mono topic-mono--lg" id="topic-avatar"></div>
        <div class="user-profile__details">
          <div class="user-profile__badges">
            <span class="user-profile__tag" id="topic-badge">Tema de Práctica</span>
          </div>
          <h1 class="user-profile__name" id="topic-title">Cargando tema...</h1>
          <p class="user-profile__email" id="topic-desc">Preguntas y ejercicios para afianzar tus conocimientos.</p>
        </div>
      </div>
    </section>

    <!-- Módulo de Cuestionarios del Tema -->
    <section class="q-module" id="q-module">
      <!-- 1. Vista Catálogo de este tema -->
      <div id="q-catalog-view">
        <h2 class="section-title section-title--sm">Cuestionarios de este tema</h2>
        <div class="q-grid" id="q-cards-grid">
          <!-- Cargados por JS -->
        </div>

        <!-- Historial específico de este tema -->
        <div class="q-history mt-15" id="q-history-container" hidden>
          <h3 class="q-history__title">Tus Intentos en este tema</h3>
          <div class="table-scroll">
            <table class="q-history__table">
              <thead>
                <tr>
                  <th>Cuestionario</th>
                  <th>Calificación</th>
                  <th>Aciertos</th>
                  <th>Fecha</th>
                </tr>
              </thead>
              <tbody id="q-history-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 2. Vista Cuestionario Activo (Player) -->
      <div id="q-player-view" hidden>
        <!-- Renderizado por JS -->
      </div>

      <!-- 3. Vista de Resultados -->
      <div id="q-results-view" hidden>
        <!-- Renderizado por JS -->
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/pages/practice.js"></script>
</body>

</html>
